<!doctype html>
<meta charset="utf-8">
<body style="margin:0;background:#000">
<script>
const fs = require('fs')
const path = require('path')

async function run(cfg) {
  // The scene is drawn on c at ss x the output size, then scaled down onto o (supersampling: no shimmer).
  const ss = cfg.ss || 1, W = cfg.w * ss, H = cfg.h * ss, strips = Math.max(1, cfg.strips || 1)
  const c = document.createElement('canvas')
  c.width = W; c.height = H
  document.body.appendChild(c)
  const o = ss > 1 ? document.createElement('canvas') : c
  if (ss > 1) { o.width = cfg.w; o.height = cfg.h }
  const octx = ss > 1 ? o.getContext('2d') : null
  if (octx) { octx.imageSmoothingEnabled = true; octx.imageSmoothingQuality = 'high' }
  const gl = c.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' })
  if (!gl) throw new Error('no WebGL 2')
  const sh = (type, s) => {
    const o = gl.createShader(type); gl.shaderSource(o, s); gl.compileShader(o)
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o))
    return o
  }
  const p = gl.createProgram()
  gl.attachShader(p, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 a;\nvoid main(){ gl_Position = vec4(a, 0.0, 1.0); }'))
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, cfg.frag))
  gl.bindAttribLocation(p, 0, 'a')
  gl.linkProgram(p)
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p))
  gl.useProgram(p)
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao)
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer())
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW)
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0)
  const U = (n) => gl.getUniformLocation(p, n)
  gl.viewport(0, 0, W, H)
  gl.uniform2f(U('iResolution'), W, H)
  gl.uniform1i(U('uSteps'), cfg.steps)
  const uT = U('iTime')
  // One draw call per horizontal strip, finished before the next: a heavy frame never holds the GPU
  // long enough for the macOS watchdog to reset it.
  gl.enable(gl.SCISSOR_TEST)
  const px = new Uint8Array(4)
  const draw = (t) => {
    gl.uniform1f(uT, t)
    for (let i = 0; i < strips; i++) {
      const y0 = Math.floor((H * i) / strips), y1 = Math.floor((H * (i + 1)) / strips)
      gl.scissor(0, y0, W, y1 - y0)
      gl.drawArrays(gl.TRIANGLES, 0, 3)
      gl.readPixels(0, y0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px)   // waits for the strip (gl.finish() does not, in Chromium)
    }
    if (gl.isContextLost()) throw new Error('the GPU dropped the context at t=' + t)
    if (octx) octx.drawImage(c, 0, 0, cfg.w, cfg.h)
  }

  if (cfg.stills) {
    for (const t of cfg.stills) {
      const t0 = performance.now()
      draw(t)
      if (cfg.stills.length < 4) console.log(`t=${t}: ${((performance.now() - t0) / 1000).toFixed(2)}s`)
      const url = o.toDataURL('image/jpeg', 0.9)
      fs.writeFileSync(path.join(cfg.outdir, `t${t.toFixed(2)}.jpg`), Buffer.from(url.split(',')[1], 'base64'))
    }
    console.log(`stills: ${cfg.stills.length} in ${cfg.outdir}`)
    return
  }

  const conf = { codec: 'avc1.640033', width: cfg.w, height: cfg.h, bitrate: cfg.bitrate, framerate: cfg.fps, avc: { format: 'annexb' }, hardwareAcceleration: 'prefer-hardware' }
  const sup = await VideoEncoder.isConfigSupported(conf)
  if (!sup.supported) throw new Error('H.264 encoding is not supported here')
  const fd = fs.openSync(cfg.out264, 'w')
  let err = null
  const enc = new VideoEncoder({
    output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); fs.writeSync(fd, b) },
    error: (e) => { err = e }
  })
  enc.configure(conf)
  const n0 = Math.round(cfg.from * cfg.fps), n1 = Math.round(cfg.to * cfg.fps)
  const t0 = performance.now()
  let last = 0
  for (let n = n0; n < n1; n++) {
    draw(n / cfg.fps)
    const f = new VideoFrame(o, { timestamp: Math.round(((n - n0) * 1e6) / cfg.fps), duration: Math.round(1e6 / cfg.fps) })
    enc.encode(f, { keyFrame: (n - n0) % (cfg.fps * 2) === 0 })
    f.close()
    while (enc.encodeQueueSize > 3) await new Promise((r) => setTimeout(r, 1))
    if (err) throw err
    if (performance.now() - last > 15000 || n === n0) {
      last = performance.now()
      const done = n - n0 + 1, rate = done / ((performance.now() - t0) / 1000)
      console.log(`frame ${done}/${n1 - n0}  song ${(n / cfg.fps).toFixed(1)}s  ${rate.toFixed(1)} fps  ~${Math.round((n1 - n) / rate)}s left`)
    }
  }
  await enc.flush()
  enc.close()
  fs.closeSync(fd)
  console.log(`encoded ${n1 - n0} frames in ${((performance.now() - t0) / 1000).toFixed(0)}s`)
}
</script>
